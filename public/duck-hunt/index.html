<!DOCTYPE HTML>
<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
<html>
<head>
  <title>DuckHuntJS</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="An open source, web based, responsive implementation of Duck Hunt in canvas or webgl depending on your client.">
  <meta name="author" content="Matt Surabian">
  <style>
    body {
      overflow:hidden;
      margin: 0;
      padding: 0;
      background-color: #000000;
    }
  </style>
  <script src="duckhunt.js"></script>
</head>
<body>

<style>
  .gz-top-badge {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(3, 7, 18, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 7px 16px;
    border-radius: 9999px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6), 0 0 10px rgba(56, 189, 248, 0.2);
    pointer-events: auto;
    user-select: none;
    animation: gzPulse 3s ease-in-out infinite alternate;
  }
  @keyframes gzPulse {
    0% { border-color: rgba(56, 189, 248, 0.35); box-shadow: 0 4px 18px rgba(0,0,0,0.6), 0 0 8px rgba(56, 189, 248, 0.15); }
    100% { border-color: rgba(147, 51, 234, 0.55); box-shadow: 0 4px 22px rgba(0,0,0,0.7), 0 0 16px rgba(147, 51, 234, 0.3); }
  }
</style>
<div class="gz-top-badge">
  <span style="font-size: 14px;">🎮</span> GAMINGZONE EDITION
</div>

</body>
</html>
