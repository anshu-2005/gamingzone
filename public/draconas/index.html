<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Drakonas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="css/animate.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/game.css" />
</head>
<body>

<style>
  .gz-top-badge {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(3, 7, 18, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 7px 16px;
    border-radius: 9999px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6), 0 0 10px rgba(56, 189, 248, 0.2);
    pointer-events: auto;
    user-select: none;
    animation: gzPulse 3s ease-in-out infinite alternate;
  }
  @keyframes gzPulse {
    0% { border-color: rgba(56, 189, 248, 0.35); box-shadow: 0 4px 18px rgba(0,0,0,0.6), 0 0 8px rgba(56, 189, 248, 0.15); }
    100% { border-color: rgba(147, 51, 234, 0.55); box-shadow: 0 4px 22px rgba(0,0,0,0.7), 0 0 16px rgba(147, 51, 234, 0.3); }
  }
</style>
<div class="gz-top-badge">
  <span style="font-size: 14px;">🎮</span> GAMINGZONE EDITION
</div>

<div id="container">
    <div class="text-center">Loading...</div>
</div>
<script src="js/lib/dom.js"></script>
<script src="js/lib/json.js"></script>
<script src="js/lib/three.min.js"></script>
<script src="js/lib/tween.js"></script>
<script src="js/lib/loader-manger.js"></script>
<script src="js/lib/objloader.js"></script>
<script src="js/lib/ImprovedNoise.js"></script>
<script src="js/main.js"></script>
<script src="js/weapons.js"></script>
<script src="js/player.js"></script>
<script src="js/controls.js"></script>
<script src="js/game.settings.js"></script>
<script src="js/game.js"></script>
<script src="js/menu.js"></script>
<script src="js/hangar.js"></script>
<div class="info-window hidden" id="window-options"></div>
<div id="full-container"></div>
<div id="b-container"></div>
<div id="background-container"></div>
</body>
</html>
