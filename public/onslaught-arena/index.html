<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Onslaught! Arena (dev)</title>
	<link href="css/horde.css" rel="stylesheet">

<style id="gz-dark-theater-patch">
  html, body {
    background-color: #030712 !important;
    background: #030712 !important;
    color: #f8fafc !important;
  }
</style>
<link rel="stylesheet" href="/gamingzone-embedded.css">


<style id="gz-centering-override">
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    min-height: 100vh !important;
    overflow: hidden !important;
    background-color: #030712 !important;
    background: #030712 !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
  }
  .nav, #tip, .ad, #clay {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
    height: 0 !important;
    width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  #stage {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    background: transparent !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  #stage canvas {
    position: relative !important;
    left: auto !important;
    top: auto !important;
    margin: auto !important;
    max-width: 98vw !important;
    max-height: 98vh !important;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    border-radius: 4px !important;
    display: block !important;
  }
</style>

</head>
<body>

<style>
  .gz-top-badge {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(3, 7, 18, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 7px 16px;
    border-radius: 9999px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6), 0 0 10px rgba(56, 189, 248, 0.2);
    pointer-events: auto;
    user-select: none;
    animation: gzPulse 3s ease-in-out infinite alternate;
  }
  @keyframes gzPulse {
    0% { border-color: rgba(56, 189, 248, 0.35); box-shadow: 0 4px 18px rgba(0,0,0,0.6), 0 0 8px rgba(56, 189, 248, 0.15); }
    100% { border-color: rgba(147, 51, 234, 0.55); box-shadow: 0 4px 22px rgba(0,0,0,0.7), 0 0 16px rgba(147, 51, 234, 0.3); }
  }
</style>
<div class="gz-top-badge">
  <span style="font-size: 14px;">🎮</span> GAMINGZONE EDITION
</div>


	

	<div id="stage"></div>

	<script src="js/base.js"></script>
	<script src="js/timer.js"></script>
	<script src="js/sound.js"></script>
	<script src="js/size.js"></script>
	<script src="js/vector2.js"></script>
	<script src="js/rect.js"></script>
	<script src="js/keyboard.js"></script>
	<script src="js/mouse.js"></script>
	<script src="js/waves_full.js"></script>
	<!--
	<script src="js/waves_demo.js"></script>
	-->
	<script src="js/engine.js"></script>
	<script src="js/object.js"></script>
	<script src="js/object_types.js"></script>
	<script src="js/image_loader.js"></script>
	<script src="js/spawn_point.js"></script>
	<script src="js/spawn_wave.js"></script>
	<script src="js/run_game.js"></script>

</body>
</html>
